# MCP Server Configuration
mcp.serverName=slack-mcp-server
mcp.serverVersion=1.0.0

# HTTP Listener Port for MCP Transport
http.port=8081

# Agent Broker Configuration
agent.broker.host=<Omni Gateway Ingress Endpoint>.cloudhub.io
agent.broker.port=443

# Slack Configuration
# slack.botToken must be set as a secure/environment property - do not store real token here
slack.botToken=xoxb-<your slack botToken>